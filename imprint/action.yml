name: Imprint
description: Exchange the GitHub Actions OIDC ID token for a workload identity federation token (RFC 8693)
inputs:
  endpoint:
    description: "Issuer URL of the identity provider performing the token exchange"
    required: false
    default: "https://login.kris.engineer"
  id_token_audience:
    description: "Audience of the GitHub OIDC ID token, must match the workload identity's audience. Defaults to `endpoint`"
    required: false
    default: ''
  scope:
    description: "Space-separated scopes to request, must be a subset of the workload identity's scopes. Defaults to all granted scopes"
    required: false
    default: ''
  audience:
    description: "Audience of the issued access token. Defaults to the workload identity's audience, else the issuer"
    required: false
    default: ''
outputs:
  access_token:
    description: "The issued access token"
    value: ${{ steps.exchange.outputs.access_token }}
  expires_in:
    description: "Lifetime of the issued access token in seconds"
    value: ${{ steps.exchange.outputs.expires_in }}
  scope:
    description: "Scopes granted on the issued access token"
    value: ${{ steps.exchange.outputs.scope }}

runs:
  using: composite
  steps:
    - id: exchange
      uses: actions/github-script@v8
      env:
        IMPRINT_ENDPOINT: ${{ inputs.endpoint }}
        IMPRINT_ID_TOKEN_AUDIENCE: ${{ inputs.id_token_audience }}
        IMPRINT_SCOPE: ${{ inputs.scope }}
        IMPRINT_AUDIENCE: ${{ inputs.audience }}
      with:
        script: |
          const endpoint = process.env.IMPRINT_ENDPOINT.replace(/\/+$/, '');
          const idToken = await core.getIDToken(process.env.IMPRINT_ID_TOKEN_AUDIENCE || endpoint);
          const body = new URLSearchParams({
            grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange',
            subject_token: idToken,
            subject_token_type: 'urn:ietf:params:oauth:token-type:jwt',
            requested_token_type: 'urn:ietf:params:oauth:token-type:access_token',
          });
          if (process.env.IMPRINT_SCOPE) body.set('scope', process.env.IMPRINT_SCOPE);
          if (process.env.IMPRINT_AUDIENCE) body.set('audience', process.env.IMPRINT_AUDIENCE);

          const response = await fetch(`${endpoint}/oauth/token`, {
            method: 'POST',
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body
          });
          const text = await response.text();
          let result;
          try {
            result = JSON.parse(text);
          } catch {
            result = {};
          }
          if (!response.ok || !result.access_token) {
            const reason = result.error ? `${result.error}: ${result.error_description ?? ''}` : text;
            core.setFailed(`${new Date().toISOString()} \x1b[1m\x1b[31m❌ Unable to obtain access token from ${endpoint}, error:\x1b[0m \x1b[1m${response.status} ${reason}\x1b[0m`);
            return;
          }

          core.setSecret(result.access_token);
          core.exportVariable('FEDERATED_TOKEN', result.access_token);
          core.setOutput('access_token', result.access_token);
          core.setOutput('expires_in', result.expires_in);
          core.setOutput('scope', result.scope ?? '');
          core.info(`${new Date().toISOString()} \x1b[1m\x1b[32m✅ Workload identity token issued\x1b[0m (scope: ${result.scope || 'none'}, expires in ${result.expires_in}s)`);
